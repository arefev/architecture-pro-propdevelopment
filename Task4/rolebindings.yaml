# ============================================================
# ========== ClusterRoleBinding: cluster-admin ================
# ============================================================

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bind-devops-admin-to-cluster-admin
subjects:
  - kind: User
    name: devops-admin
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io


